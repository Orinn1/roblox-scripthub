<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="006f5ad39e692eb6afe28008d13ae710">
  <title>ปลดล็อกลิงก์และไฟล์ฟรี &mdash; Social Unlock Gateway</title>
  
  <!-- Monetag MultiTag / OnClick Popunder Script (Zone 303760) -->
  <script src="https://quge5.com/88/tag.min.js" data-zone="303760" async data-cfasync="false"></script>
  
  <!-- Google Fonts: Kanit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/gateflow/css/main.css">
  <link rel="stylesheet" href="/gateflow/css/locker.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="social-viewport">

  <!-- Ambient Blurred Blue Glow Spheres -->
  <div class="bokeh-sphere sphere-top-left" aria-hidden="true"></div>
  <div class="bokeh-sphere sphere-top-right" aria-hidden="true"></div>
  <div class="bokeh-sphere sphere-bottom-left" aria-hidden="true"></div>
  <div class="bokeh-sphere sphere-bottom-right" aria-hidden="true"></div>

  <!-- Central Sub2Unlock Floating Card -->
  <main class="social-card-wrapper">
    <div class="social-modal-card">

      <!-- Title & Subtitle -->
      <h1 class="social-modal-title" id="lockerTitle">ปลดล็อกลิงก์ดาวน์โหลด</h1>
      <p class="social-modal-sub" id="lockerDesc">ทำภารกิจสนับสนุน 6 ขั้นตอนด้านล่างเพื่อรับไฟล์/สคริปต์ฟรี</p>

      <!-- Task Action Buttons (6 Tasks: 3 YouTube + 3 Ads) -->
      <div class="social-tasks-group">

        <!-- Task 1: Subscribe on YouTube -->
        <button type="button" class="btn-social-yt" id="btnTask1" onclick="handleTaskClick(1)">
          <div class="yt-inner">
            <svg class="yt-svg-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/>
              <path fill="#ffffff" d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            <span id="txtTask1">Subscribe on YouTube (กดติดตาม)</span>
          </div>
          <i data-lucide="check" class="task-check-icon" id="checkTask1" style="display: none; width: 16px; height: 16px;"></i>
        </button>

        <!-- Task 2: Like Video -->
        <button type="button" class="btn-social-yt" id="btnTask2" onclick="handleTaskClick(2)">
          <div class="yt-inner">
            <i data-lucide="thumbs-up" style="width: 17px; height: 17px;"></i>
            <span id="txtTask2">Like Video (กดไลค์คลิป)</span>
          </div>
          <i data-lucide="check" class="task-check-icon" id="checkTask2" style="display: none; width: 16px; height: 16px;"></i>
        </button>

        <!-- Task 3: Comment on Video -->
        <button type="button" class="btn-social-yt" id="btnTask3" onclick="handleTaskClick(3)">
          <div class="yt-inner">
            <i data-lucide="message-square" style="width: 17px; height: 17px;"></i>
            <span id="txtTask3">Comment Video (คอมเมนต์คลิป)</span>
          </div>
          <i data-lucide="check" class="task-check-icon" id="checkTask3" style="display: none; width: 16px; height: 16px;"></i>
        </button>

        <!-- Task 4: Ad Link 1 -->
        <button type="button" class="btn-social-ad" id="btnTask4" onclick="handleTaskClick(4)">
          <div class="yt-inner">
            <i data-lucide="sparkles" style="width: 17px; height: 17px; color: #60a5fa;"></i>
            <span id="txtTask4">Visit Sponsor #1 (ลิงก์โฆษณา 1)</span>
          </div>
          <i data-lucide="check" class="task-check-icon" id="checkTask4" style="display: none; width: 16px; height: 16px;"></i>
        </button>

        <!-- Task 5: Ad Link 2 -->
        <button type="button" class="btn-social-ad" id="btnTask5" onclick="handleTaskClick(5)">
          <div class="yt-inner">
            <i data-lucide="zap" style="width: 17px; height: 17px; color: #fbbf24;"></i>
            <span id="txtTask5">Visit Sponsor #2 (ลิงก์โฆษณา 2)</span>
          </div>
          <i data-lucide="check" class="task-check-icon" id="checkTask5" style="display: none; width: 16px; height: 16px;"></i>
        </button>

        <!-- Task 6: Ad Link 3 -->
        <button type="button" class="btn-social-ad" id="btnTask6" onclick="handleTaskClick(6)">
          <div class="yt-inner">
            <i data-lucide="flame" style="width: 17px; height: 17px; color: #f87171;"></i>
            <span id="txtTask6">Visit Sponsor #3 (ลิงก์โฆษณา 3)</span>
          </div>
          <i data-lucide="check" class="task-check-icon" id="checkTask6" style="display: none; width: 16px; height: 16px;"></i>
        </button>

      </div>

      <!-- Unlock Progress Track -->
      <div class="social-progress-block">
        <div class="social-progress-head">
          <span class="lbl-unlock-progress">Unlock progress</span>
          <span class="val-unlock-progress" id="txtProgressVal">0/6</span>
        </div>
        <div class="social-progress-track">
          <div class="social-progress-bar" id="barProgressFill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Unlock Button -->
      <button type="button" class="btn-social-unlock locked" id="btnUnlock" disabled onclick="handleUnlockClick()">
        <i data-lucide="lock" id="iconUnlock" style="width: 15px; height: 15px;"></i>
        <span id="txtUnlock">Unlock</span>
      </button>

      <!-- Unlocked Script Result Box (Reveals directly inside card when script is unlocked) -->
      <div class="social-script-result" id="scriptResultBox" style="display: none;">
        <div class="script-box-header">
          <div class="script-badge">
            <i data-lucide="code" style="width: 13px; height: 13px;"></i>
            <span>SCRIPT UNLOCKED</span>
          </div>
          <span class="script-status">ปลดล็อกสำเร็จแล้ว 🎉</span>
        </div>

        <div class="script-code-wrap">
          <pre><code id="scriptCodeText">-- Script loading...</code></pre>
        </div>

        <button type="button" class="btn-copy-script" id="btnCopyScript" onclick="copyUnlockedScript()">
          <i data-lucide="copy" id="iconCopyScript" style="width: 16px; height: 16px;"></i>
          <span id="txtCopyScript">คัดลอกสคริปต์ (Copy Script) 📋</span>
        </button>
      </div>

    </div>
  </main>

  <!-- Clean Floating Toast -->
  <div id="toastContainer"></div>

  <!-- Monetag In-Page Push Banner (Zone 12157090) -->
  <script>(function(s){s.dataset.zone='12157090',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

  <!-- Monetag Push Notification Service Worker Registration (Zone 12157291) -->
  <script>
    if ('serviceWorker' in navigator && !window.__IS_VIP__) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }
  </script>

  <!-- Logic Scripts -->
  <script src="/gateflow/js/locker.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
